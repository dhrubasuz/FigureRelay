[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "figurerelay"
version = "0.1.0"
description = "Review and publish Office reports from stable source values"
requires-python = ">=3.11"
authors = [{name = "Dhruba Poudel"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
figurerelay = "figurerelay.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["figurerelay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
